[workspace]
members = ["crates/formats", "crates/input", "crates/course", "crates/render", "crates/content", "crates/import", "crates/simulation", "crates/presentation", "apps/game"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["std", "default_app", "bevy_log", "2d_bevy_render", "png", "bevy_winit", "x11", "multi_threaded"] }
