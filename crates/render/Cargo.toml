[package]
name = "rr-render"
default-run = "rr-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rr-formats = { path = "../formats" }
rr-course = { path = "../course" }
rr-content = { path = "../content" }
rr-import = { path = "../import" }
rr-simulation = { path = "../simulation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
bevy_tasks = { version = "=0.20.1", default-features = false, features = ["multi_threaded"] }
