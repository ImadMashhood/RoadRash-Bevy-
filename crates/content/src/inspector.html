<!doctype html><meta charset="utf-8"><title>RoadRash asset inspector</title>
<style>body{margin:24px;background:#151821;color:#e7eaf1;font:14px system-ui}input,select,button{font:inherit;padding:7px;margin:4px;background:#252b3b;color:inherit;border:1px solid #63708d}canvas{display:block;max-width:100%;border:1px solid #63708d}#sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.tile{background:#252b3b;padding:8px;overflow-wrap:anywhere;cursor:pointer}.tile img{width:150px;height:100px;object-fit:contain;image-rendering:pixelated}pre{white-space:pre-wrap}a{color:#91bcff}</style>
<h1>RoadRash — local asset inspector</h1><p>Source pixels and approved derivatives stay local. Empty frame slots remain selectable. Pivots are explicitly authored bottom-center conventions.</p>
<label>Search <input id="search" placeholder="ID, source, category"></label><label>Asset <select id="asset"></select></label>
<button id="prev">Previous frame</button><button id="next">Next frame</button><button id="play">Play family</button>
<label>Palette/remap <select id="palette"></select></label><label>Sampling <select id="filter"><option>nearest</option><option>linear</option></select></label>
<label>Alpha background <select id="alpha"><option>checker</option><option>white</option><option>black</option></select></label><label>Zoom <select id="zoom"><option>1</option><option selected>2</option><option>4</option></select></label>
<canvas width="640" height="480" id="view"></canvas><pre id="info"></pre><h2>Searchable contact sheet</h2><p>Click a thumbnail to select its exact semantic ID. Pagination keeps large corpora responsive.</p><button id="back">Previous page</button><button id="forward">Next page</button><span id="page"></span><div id="sheet"></div>
<script>
const catalog=__CATALOG__, $=id=>document.getElementById(id), all=catalog.entries;let selected=all.find(e=>e.preview_variants.length)||all[0], page=0, timer=null, generation=0, selectedPalette=0;
const ctx=$('view').getContext('2d');
function filtered(){let q=$('search').value.toLowerCase();return all.filter(e=>(e.id+' '+e.source+' '+e.kind+' '+e.subcategory).toLowerCase().includes(q))}
function showSheet(){const entries=filtered();$('asset').replaceChildren(...entries.map(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.id;return o}));if(selected)$('asset').value=selected.id;const start=page*60;$('sheet').replaceChildren(...entries.slice(start,start+60).map(e=>{const d=document.createElement('div');d.className='tile';d.dataset.asset=e.id;const im=document.createElement('img');if(e.preview_variants.length)im.src='objects/'+e.preview_variants[0];im.alt=e.id;const text=document.createElement('div');text.textContent=e.id+' · '+e.kind+'/'+e.subcategory+' · '+e.native_size.join('×');if(e.preview_variants.length)d.append(im);d.append(text);d.onclick=()=>choose(e.id);return d}));$('page').textContent=` ${page+1} / ${Math.max(1,Math.ceil(entries.length/60))} — ${entries.length} records`}
function choose(id){const previousPalette=selectedPalette;selected=all.find(e=>e.id===id)||selected;$('asset').value=selected.id;$('palette').replaceChildren(...Array.from({length:Math.max(1,selected.preview_variants.length)},(_,i)=>{const o=document.createElement('option');o.value=i;o.textContent=i;return o}));$('palette').value=Math.min(previousPalette,Math.max(0,selected.preview_variants.length-1));if(!Array.from($('asset').options).some(o=>o.value===selected.id)){const o=document.createElement('option');o.value=selected.id;o.textContent=selected.id;$('asset').append(o);$('asset').value=selected.id}draw()}
function background(){const mode=$('alpha').value;ctx.fillStyle=mode==='black'?'#000':'#fff';ctx.fillRect(0,0,640,480);if(mode==='checker'){for(let y=0;y<480;y+=16)for(let x=0;x<640;x+=16){ctx.fillStyle=(x/16+y/16)%2?'#bbb':'#eee';ctx.fillRect(x,y,16,16)}}}
function draw(){if(!selected)return;const version=++generation;background();$('info').textContent=JSON.stringify(selected,null,2);const file=selected.preview_variants[+$('palette').value||0];if(!file){ctx.fillStyle='#334';ctx.fillText('Empty slot or opaque record — source metadata retained',20,30);return}const img=new Image();img.onload=()=>{if(version!==generation)return;const scale=+$('zoom').value;ctx.imageSmoothingEnabled=$('filter').value==='linear';ctx.drawImage(img,320-selected.pivot_twice[0]*scale/2,400-selected.pivot_twice[1]*scale/2,img.width*scale,img.height*scale);ctx.strokeStyle='#00a040';ctx.beginPath();ctx.moveTo(310,400);ctx.lineTo(330,400);ctx.moveTo(320,390);ctx.lineTo(320,410);ctx.stroke()};img.src='objects/'+file}
function step(delta){const family=selected.frame===null?all:all.filter(e=>e.source===selected.source&&e.frame!==null);const i=family.indexOf(selected);choose(family[(i+delta+family.length)%family.length].id)}
$('search').oninput=()=>{page=0;showSheet()};$('asset').onchange=()=>choose($('asset').value);$('palette').onchange=()=>{selectedPalette=+$('palette').value;draw()};for(const id of ['filter','alpha','zoom'])$(id).onchange=draw;$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='Play family'}else{timer=setInterval(()=>step(1),100);$('play').textContent='Pause family'}};$('back').onclick=()=>{page=Math.max(0,page-1);showSheet()};$('forward').onclick=()=>{page=Math.min(Math.max(0,Math.ceil(filtered().length/60)-1),page+1);showSheet()};showSheet();choose(selected.id);
</script>
