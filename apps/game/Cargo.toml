[package]
name = "rr-game"
default-run = "rr-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rr-input = { path = "../../crates/input" }
rr-simulation = { path = "../../crates/simulation" }
rr-presentation = { path = "../../crates/presentation" }
bevy = { workspace = true }
rr-import = { path = "../../crates/import" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rr-content = { path = "../../crates/content" }
rr-formats = { path = "../../crates/formats" }

rr-render = { path = "../../crates/render" }
rr-course = { path = "../../crates/course" }

rr-session = { path = "../../crates/session" }

rr-media = { path = "../../crates/media" }
rodio = { version = "=0.22.2", default-features = false, features = ["playback"] }
