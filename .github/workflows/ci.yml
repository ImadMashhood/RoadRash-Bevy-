name: Rust foundation
on: [push, pull_request]
jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - run: python3 tools/private_corpus.py
      - run: python3 tools/check_workflow_guards.py
      - run: cargo fmt --all --check
      - run: cargo test --locked -p rr-formats -p rr-simulation -p rr-import -p rr-content -p rr-course -p rr-render -p rr-input
      - run: cargo clippy --locked -p rr-formats -p rr-simulation -p rr-import -p rr-content -p rr-course -p rr-render -p rr-input --all-targets -- -D warnings
  desktop-check:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxkbcommon-dev libudev-dev
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --release --workspace
      - run: cargo test --locked --release -p rr-presentation --lib
      - run: cargo run --locked --release -p rr-formats --bin rr-format-fuzz -- 1000 /tmp/rr-format-fuzz.json
      - run: cargo run --locked --release -p rr-simulation --bin rr-replay -- docs/fixtures/replay.json irregular /tmp/rr-replay.json
      - run: cargo run --locked --release -p rr-simulation --bin rr-replay -- docs/fixtures/encounter-replay.json irregular /tmp/rr-encounter-replay.json
      - run: cargo run --locked --release -p rr-simulation --bin rr-replay -- docs/fixtures/population-replay.json irregular /tmp/rr-population-replay.json
