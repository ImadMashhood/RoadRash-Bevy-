name: Rust foundation
on: [push, pull_request]
jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - run: cargo fmt --all --check
      - run: cargo test --locked -p rr-formats -p rr-simulation
      - run: cargo clippy --locked -p rr-formats -p rr-simulation --all-targets -- -D warnings
  desktop-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxkbcommon-dev
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
